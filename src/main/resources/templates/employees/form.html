<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Darbinieks – B-Keeper</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
<style>
:root{--sw:220px}
body{background:#f8fafc;font-size:.9rem}
.bk-sidebar{width:var(--sw);min-height:100vh;background:#1e293b;position:fixed;top:0;left:0;z-index:100;display:flex;flex-direction:column}
.bk-sidebar .brand{color:#fff;font-weight:700;font-size:1.2rem;padding:1.25rem 1.25rem .75rem;letter-spacing:.05em}
.bk-sidebar .brand span{color:#60a5fa}
.nav-section{color:#475569;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:.75rem 1.25rem .25rem}
.bk-sidebar a{color:#94a3b8;padding:.5rem 1.25rem;border-radius:.375rem;margin:.1rem .5rem;text-decoration:none;display:block}
.bk-sidebar a:hover,.bk-sidebar a.active{color:#f1f5f9;background:#334155}
.bk-main{margin-left:var(--sw);padding:1.5rem}
.bk-topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 1.5rem;margin:-1.5rem -1.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>

<nav th:replace="~{fragments/nav :: sidebar('employees')}"></nav>

<main class="bk-main">
    <div class="bk-topbar">
        <h5 class="mb-0 fw-semibold" th:text="${employee.id==null} ? 'Jauns darbinieks' : 'Labot darbinieku'">Darbinieks</h5>
        <a th:href="@{/employees}" class="btn btn-sm btn-outline-secondary">← Atpakaļ</a>
    </div>
    <div class="card border-0 shadow-sm p-4" style="max-width:600px">
        <form th:action="@{/employees/save}" method="post" th:object="${employee}">
            <input type="hidden" th:field="*{id}"/>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Personas kods</label>
                    <input type="text" class="form-control" th:field="*{personalCode}" placeholder="DDMMYY-NNNNN" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Vārds</label>
                    <input type="text" class="form-control" th:field="*{firstName}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Uzvārds</label>
                    <input type="text" class="form-control" th:field="*{lastName}" required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Amats</label>
                    <input type="text" class="form-control" th:field="*{position}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Bruto alga (EUR)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{monthlyGross}" required/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Neapl. min. (EUR)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{nonTaxableMin}"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Darba sākums</label>
                    <input type="date" class="form-control" th:field="*{employmentStart}" required/>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Darba beigas</label>
                    <input type="date" class="form-control" th:field="*{employmentEnd}"/>
                </div>
                <div class="col-md-4 d-flex align-items-end gap-3 pb-1">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{taxBookSubmitted}" id="taxBook"/>
                        <label class="form-check-label" for="taxBook">Nodokļu grāmatiņa</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="active"/>
                        <label class="form-check-label" for="active">Aktīvs</label>
                    </div>
                </div>
                <div class="col-12 d-flex gap-2 mt-2">
                    <button type="submit" class="btn btn-primary">Saglabāt</button>
                    <a th:href="@{/employees}" class="btn btn-outline-secondary">Atcelt</a>
                </div>
            </div>
        </form>
    </div>
</main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body></html>
