<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>EDS – B-Keeper</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
<style>
:root{--sw:220px}
body{background:#f8fafc;font-size:.9rem}
.bk-sidebar{width:var(--sw);min-height:100vh;background:#1e293b;position:fixed;top:0;left:0;z-index:100;display:flex;flex-direction:column}
.bk-sidebar .brand{color:#fff;font-weight:700;font-size:1.2rem;padding:1.25rem 1.25rem .75rem;letter-spacing:.05em}
.bk-sidebar .brand span{color:#60a5fa}
.nav-section{color:#475569;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:.75rem 1.25rem .25rem}
.bk-sidebar a{color:#94a3b8;padding:.5rem 1.25rem;border-radius:.375rem;margin:.1rem .5rem;text-decoration:none;display:block}
.bk-sidebar a:hover,.bk-sidebar a.active{color:#f1f5f9;background:#334155}
.bk-main{margin-left:var(--sw);padding:1.5rem}
.bk-topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 1.5rem;margin:-1.5rem -1.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>

<nav th:replace="~{fragments/nav :: sidebar(${currentPage})}"></nav>

<main class="bk-main">
    <div class="bk-topbar">
        <h5 class="mb-0 fw-semibold" th:text="${docType} + ' iesniegšanas vēsture'">EDS</h5>
    </div>
    <div class="alert alert-info">
        <strong>Drīzumā:</strong> Šajā sadaļā varēs ģenerēt XML un iesniegt EDS automātiski.
        Pagaidām varat manuāli ielādēt ģenerētos failus EDS.
    </div>
    <div class="card border-0 shadow-sm">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr><th>Tips</th><th>Periods</th><th>Statuss</th><th>EDS dok. nr.</th><th>Iesniegts</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(submissions)}">
                <td colspan="5" class="text-center text-muted py-4">Nav iesniegumu</td>
            </tr>
            <tr th:each="s : ${submissions}">
                <td th:text="${s.documentType}">-</td>
                <td th:text="${s.periodYear} + '/' + ${s.periodMonth}">-</td>
                <td><span class="badge"
                          th:classappend="${s.status=='ACCEPTED'} ? 'bg-success' : (${s.status=='SUBMITTED'} ? 'bg-primary' : (${s.status=='READY'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                          th:text="${s.status}">-</span></td>
                <td th:text="${s.edsDocNumber}">-</td>
                <td th:text="${s.submittedAt}">-</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body></html>
