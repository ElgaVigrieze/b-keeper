<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>I/I Žurnāls – B-Keeper</title>
<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
<style>
:root{--sw:220px}
body{background:#f8fafc;font-size:.9rem}
.bk-sidebar{width:var(--sw);min-height:100vh;background:#1e293b;position:fixed;top:0;left:0;z-index:100;display:flex;flex-direction:column}
.bk-sidebar .brand{color:#fff;font-weight:700;font-size:1.2rem;padding:1.25rem 1.25rem .75rem;letter-spacing:.05em}
.bk-sidebar .brand span{color:#60a5fa}
.nav-section{color:#475569;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:.75rem 1.25rem .25rem}
.bk-sidebar a{color:#94a3b8;padding:.5rem 1.25rem;border-radius:.375rem;margin:.1rem .5rem;text-decoration:none;display:block}
.bk-sidebar a:hover,.bk-sidebar a.active{color:#f1f5f9;background:#334155}
.bk-main{margin-left:var(--sw);padding:1.5rem}
.bk-topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 1.5rem;margin:-1.5rem -1.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>

<nav th:replace="~{fragments/nav :: sidebar('journal')}"></nav>

<main class="bk-main">
    <div class="bk-topbar">
        <h5 class="mb-0 fw-semibold">Ieņēmumu un izdevumu uzskaites žurnāls</h5>
        <form method="get" class="d-flex gap-2">
            <select name="month" class="form-select form-select-sm" style="width:150px" onchange="this.form.submit()">
                <option th:each="e:${months}" th:value="${e.key}" th:selected="${e.key==displayMonth}" th:text="${e.value}"></option>
            </select>
            <select name="year" class="form-select form-select-sm" style="width:90px" onchange="this.form.submit()">
                <option th:each="y:${#numbers.sequence(2024,2030)}" th:value="${y}" th:selected="${y==displayYear}" th:text="${y}"></option>
            </select>
        </form>
    </div>
    <div class="card border-0 shadow-sm">
        <table class="table table-sm table-hover mb-0">
            <thead class="table-light">
            <tr><th>Datums</th><th>Apraksts</th><th>Ref.</th><th>Veids</th><th class="text-end text-success">Ieņēmumi</th><th class="text-end text-danger">Izdevumi</th></tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(entries)}">
                <td colspan="6" class="text-center text-muted py-4">Nav ierakstu šajā periodā</td>
            </tr>
            <tr th:each="e : ${entries}">
                <td th:text="${e.entryDate}">-</td>
                <td th:text="${e.description}">-</td>
                <td><small class="text-muted" th:text="${e.reference}">-</small></td>
                <td><small class="badge bg-light text-dark" th:text="${e.entryType}">-</small></td>
                <td class="text-end text-success" th:text="${e.incomeAmount != null and e.incomeAmount > 0} ? ${#numbers.formatDecimal(e.incomeAmount,1,2)} : ''">-</td>
                <td class="text-end text-danger" th:text="${e.expenseAmount != null and e.expenseAmount > 0} ? ${#numbers.formatDecimal(e.expenseAmount,1,2)} : ''">-</td>
            </tr>
            </tbody>
            <tfoot class="table-light fw-bold">
            <tr>
                <td colspan="4">Kopā</td>
                <td class="text-end text-success" th:text="${#numbers.formatDecimal(totalIncome,1,2)}">0.00</td>
                <td class="text-end text-danger" th:text="${#numbers.formatDecimal(totalExpense,1,2)}">0.00</td>
            </tr>
            </tfoot>
        </table>
    </div>
    <p class="text-muted small mt-2">Žurnāls tiek aizpildīts automātiski no rēķiniem un algu aprēķiniem.</p>
</main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body></html>
