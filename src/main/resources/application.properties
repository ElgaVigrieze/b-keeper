spring.application.name=B-Keeper
server.port=8090

# SQLite datasource — driver must be set explicitly, no auto-detection
spring.datasource.url=jdbc:sqlite:${user.home}/bkeeper/bkeeper.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable JPA/Hibernate auto-config (we use Spring Data JDBC only)
# Note: Boot 4 moved this class to the spring-boot-hibernate module; the exclude is
# a no-op unless Hibernate is ever added to the classpath.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Thymeleaf
spring.thymeleaf.cache=false

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.lv.bkeeper=INFO
logging.level.org.springframework.data.jdbc=DEBUG
